services:
  redis:
    image: redis:7-alpine
    container_name: ca_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ca_dashboard
    ports:
      - "8501:8501"
    environment:
      REDIS_URL: redis://redis:6379/0
      DUCKDB_PATH: /app/warehouse.duckdb
    volumes:
      - ./warehouse.duckdb:/app/warehouse.duckdb
      - ./reports:/app/reports
    depends_on:
      redis:
        condition: service_healthy
    command: ["streamlit", "run", "dashboards/app.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  redis-data:
